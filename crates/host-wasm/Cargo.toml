[package]
name = "host-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
# `cdylib` is the module a browser instantiates; the rlib lets a host-side
# check link the same code natively.
crate-type = ["cdylib", "rlib"]

[dependencies]
host = { path = "../host" }
